[workspace]
members = [
    "crates/irgate-core",
    "crates/irgate",
    "crates/irgate-enroll",
]
resolver = "2"

[workspace.dependencies]
tract-onnx = "0.23"
image = "0.25.4"
anyhow = "1.0"
thiserror = "1.0"
config = { version = "0.14", features = ["toml"] }
dirs = "5.0"
clap = { version = "4.5", features = ["derive", "env"] }
byteorder = "1.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# irgate runs once per unlock as a short-lived process, so startup size
# matters more than compile time: strip symbols, let LTO fold the tract
# graph machinery down, and give the optimiser the whole crate at once.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
